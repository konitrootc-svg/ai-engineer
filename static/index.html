<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Engineer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ef; --panel:#fbfcfb; --ink:#16231f; --muted:#5d6d67;
  --line:#d3dbd7; --me:#16231f; --me-ink:#f3f6f4; --bot:#e1ebe7; --accent:#0f6b63;
  --code:#16231f; --code-ink:#d7efe6;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f1815; --panel:#15211d; --ink:#e4ece8; --muted:#8fa19a; --line:#27352f;
    --me:#2c8a7f; --me-ink:#fff; --bot:#1d2c27; --accent:#5fc2b4; --code:#0b1210; --code-ink:#cfeee4}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans","Noto Sans Khmer",system-ui,sans-serif}
.app{max-width:760px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--panel);border-inline:1px solid var(--line)}
header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px}
header h1{font-size:1.1rem;margin:0;font-weight:600}
header span{font:.85rem "IBM Plex Mono",monospace;color:var(--muted)}
header button{margin-inline-start:auto}
#log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.m{max-width:86%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--bot);border-bottom-left-radius:4px}
.bot pre{background:var(--code);color:var(--code-ink);padding:10px 12px;border-radius:8px;overflow-x:auto;font:.85rem/1.5 "IBM Plex Mono",monospace;margin:8px 0;white-space:pre}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:30ch}
form{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
textarea{flex:1;resize:none;max-height:140px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{border:0;border-radius:10px;padding:0 18px;font:inherit;font-weight:600;background:var(--accent);color:#fff;cursor:pointer}
button.ghost{background:none;color:var(--muted);padding:4px 8px;font-weight:400}
button:disabled{opacity:.5;cursor:default}
.err{color:#b3261e}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>AI Engineer</h1><span>@generatorsupbot</span>
    <button class="ghost" id="reset" type="button">ចាប់ផ្តើមថ្មី</button>
  </header>
  <div id="log" aria-live="polite"><p class="empty" id="empty">សួរអ្វីក៏បាន អំពីកូដ ឬបច្ចេកទេស។</p></div>
  <form id="f">
    <textarea id="t" rows="1" placeholder="វាយសាររបស់អ្នក…" aria-label="សារ"></textarea>
    <button id="send" type="submit">ផ្ញើ</button>
  </form>
</div>
<script>
const log=document.getElementById('log'),t=document.getElementById('t'),
      send=document.getElementById('send'),f=document.getElementById('f');
let sid=null;
try{sid=localStorage.getItem('sid')}catch(e){}
if(!sid){sid=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/-/g,'');
  try{localStorage.setItem('sid',sid)}catch(e){}}

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(s){
  return esc(s).replace(/```[\w-]*\n?([\s\S]*?)```/g,(_,c)=>'<pre>'+c.replace(/\n$/,'')+'</pre>')
}
function add(cls,html){
  const e=document.getElementById('empty'); if(e) e.remove();
  const d=document.createElement('div'); d.className='m '+cls; d.innerHTML=html;
  log.appendChild(d); log.scrollTop=log.scrollHeight; return d;
}
f.addEventListener('submit',async ev=>{
  ev.preventDefault();
  const text=t.value.trim(); if(!text) return;
  t.value=''; t.style.height='auto'; send.disabled=true;
  add('me',esc(text));
  const wait=add('bot','…');
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({session:sid,message:text})});
    if(!r.ok) throw new Error();
    wait.innerHTML=render((await r.json()).reply);
  }catch(e){
    wait.classList.add('err'); wait.textContent='មានបញ្ហា សូមព្យាយាមម្តងទៀត។';
  }
  send.disabled=false; t.focus(); log.scrollTop=log.scrollHeight;
});
t.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();f.requestSubmit()}});
t.addEventListener('input',()=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px'});
document.getElementById('reset').onclick=()=>{
  sid=sid.slice(0,16)+Date.now().toString(36);
  try{localStorage.setItem('sid',sid)}catch(e){}
  log.innerHTML='<p class="empty" id="empty">សួរអ្វីក៏បាន អំពីកូដ ឬបច្ចេកទេស។</p>';
};
</script>
</body>
    </html>
